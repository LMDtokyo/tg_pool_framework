server {
    listen 80;
    listen [::]:80;
    server_name 142-111-194-9.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 142-111-194-9.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/142-111-194-9.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/142-111-194-9.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 5m;

    # License server - public activation/validation surface only.
    # Admin surface (8110) stays localhost-only, never proxied here.
    location /license-api/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payment server - public customer-facing surface only.
    # Admin (8210) and webhook (8220) surfaces stay localhost-only.
    location /pay-api/ {
        proxy_pass http://127.0.0.1:8200/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static launcher installer downloads, served straight from disk -- no
    # backend process involved. Filenames are versioned (see
    # LATEST_LAUNCHER_DOWNLOAD_URL in license_server's .env.public), so this
    # directory just accumulates release artifacts; nothing here is secret.
    location /releases/ {
        alias /opt/tgpool/releases/;
        autoindex off;
    }

    location / {
        return 404;
    }
}
