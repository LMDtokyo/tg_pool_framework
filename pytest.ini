[pytest]
# Корневая директория для поиска тестов
testpaths = tests

# Режим asyncio: auto — все async-тесты автоматически запускаются
# через asyncio event loop без явного @pytest.mark.asyncio
asyncio_mode = auto

# Минимальная версия pytest
minversion = 8.0

# Вывод: -v подробно, -s без перехвата stdout
addopts = -v --tb=short

# Паттерн поиска тестовых файлов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Маркировка (для фильтрации через -m)
markers =
    asyncio: async тест
    unit: модульный тест (без сети)
    integration: интеграционный тест (требует реальные аккаунты)
